<!-- Access External Data -->
<div class="display-inline-block margin-top-md">
    <!-- Date filter -->
    <div class="flex-row-cdt" style="align-items: center;">
        <div class="flex-col">
            <i18n>from</i18n>
            &#58;&nbsp;
        </div>
        <!-- start date -->
        <div class="flex-col flex-col margin-right-md card diary-date-picker">
            <i class="text-xl margin-sm icon diary-calendar svg-green"></i>
            <date-picker
                    ng-model="filters.startDate"
                    ng-change="updateFilter()"
                    class="date-picker-sm remove-margin">
            </date-picker>
        </div>
        <div class="flex-col">
            <i18n>to</i18n>
            &#58;&nbsp;
        </div>
        <!-- end date -->
        <div class="flex-col flex-col margin-right-md card diary-date-picker">
            <i class="text-xl margin-sm icon diary-calendar svg-green"></i>
            <date-picker
                    ng-model="filters.endDate"
                    ng-change="updateFilter()"
                    class="date-picker-sm remove-margin">
            </date-picker>
        </div>
    </div>

    <!-- filter area -->
    <div class="flex-row-cdt margin-bottom-md">
        <div class="flex-col margin-right-md">
            <div class="button-checkbox" ng-class="vised ? 'active' : 'unactive'" ng-click="toggleVised()">
                <i18n>sessions.admin.Visa.sateOk</i18n>
            </div>
        </div>
        <div class="flex-col margin-right-md">
            <div class="button-checkbox" ng-class="notVised ? 'active' : 'unactive'" ng-click="toggleNotVised()">
                <i18n>sessions.admin.Visa.sateKo</i18n>
            </div>
        </div>
        <div class="flex-col margin-right-md">
            <div class="button-checkbox" ng-class="published ? 'active' : 'unactive'" ng-click="togglePublished()">
                <i18n>published.p</i18n>
            </div>
        </div>
        <div class="flex-col margin-right-md">
            <div class="button-checkbox" ng-class="notPublished ? 'active' : 'unactive'" ng-click="toggleNotPublished()">
                <i18n>notpublished.p</i18n>
            </div>
        </div>
    </div>

    <!-- Visa en masse : droit distinct administrator.visa.mass.manage, jamais accordé par défaut -->
    <div class="flex-row-cdt margin-bottom-md" ng-if="canMassVisa">
        <div class="flex-col margin-right-md" ng-if="!massVisaMode">
            <button type="button" ng-disabled="massVisaLoading" ng-click="selectAllMatchingFilter()">
                <span class="loader" ng-if="massVisaLoading"></span>
                <i18n>diary.visa.mass.select</i18n>
            </button>
        </div>
        <div class="flex-col margin-right-md" ng-if="massVisaMode">
            <!-- Compte la sélection réelle (décochable ligne par ligne), pas le total récupéré -->
            <span class="card">[[getSelectedNotebooks().length]] / [[massVisaTotal]] <i18n>diary.visa.mass.selected.count</i18n></span>
            <button type="button" ng-disabled="getSelectedNotebooks().length === 0" ng-click="wantCreateVisa()">
                <i18n>diary.visa.mass.viser</i18n>
            </button>
            <button type="button" class="cancel" ng-click="cancelMassVisaSelection()">
                <i18n>utils.cancel</i18n>
            </button>
        </div>
    </div>
</div>
