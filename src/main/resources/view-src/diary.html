<!DOCTYPE html>
<html>

<head>
	<title>{{#i18n}}diary.title{{/i18n}}</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="initial-scale=1, maximum-scale=1">

	<script src="/assets/js/entcore/ng-app.js?v=@@VERSION" id="context" type="text/javascript"></script>
	<script type="text/javascript" src="/diary/public/dist/application.js?v=@@VERSION"></script>
	
	<!-- Styles du bandeau de bascule (échafaudage de migration, supprimé avec l'IHM AngularJS). -->
		<style type="text/css">
		  .diary-ui-switch {
		    position: fixed;
		    left: 50%;
		    bottom: 16px;
		    transform: translateX(-50%);
		    z-index: 9000;
		    max-width: calc(100vw - 32px);
		    display: flex;
		    align-items: center;
		    gap: 24px;
		    padding: 12px 16px;
		    border-radius: 8px;
		    background: #243242;
		    color: #fff;
		    box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
		    font-size: 14px;
		  }
		  .diary-ui-switch[hidden] { display: none; }
		  .diary-ui-switch-text { display: flex; flex-direction: column; gap: 2px; }
		  .diary-ui-switch-text span { opacity: .8; }
		  .diary-ui-switch-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
		  .diary-ui-switch-actions button {
		    border: 0;
		    border-radius: 6px;
		    padding: 8px 14px;
		    font-size: 14px;
		    cursor: pointer;
		    background: transparent;
		    color: #fff;
		    text-decoration: underline;
		  }
		  .diary-ui-switch-actions button.primary {
		    background: #fff;
		    color: #243242;
		    font-weight: 600;
		    text-decoration: none;
		  }
		  @media (max-width: 600px) {
		    .diary-ui-switch { flex-direction: column; align-items: stretch; gap: 12px; }
		  }
		  .diary-ui-fab[hidden] { display: none; }
		  .diary-ui-fab { position: fixed; right: 16px; bottom: 16px; z-index: 9500; font-size: 14px; }
		  .diary-ui-fab > button { border: 0; border-radius: 20px; padding: 8px 14px; background: #243242; color: #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
		  .diary-ui-fab-menu { position: absolute; right: 0; bottom: 44px; min-width: 200px; background: #fff; color: #243242; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.3); padding: 6px; }
		  .diary-ui-fab-menu[hidden] { display: none; }
		  .diary-ui-fab-menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: inherit; font-size: 14px; }
		  .diary-ui-fab-menu button:hover { background: #eef1f4; }
		  .diary-ui-fab-menu button[aria-current="true"] { font-weight: 700; }
		</style>
	<script type="text/ng-template" id="empty"></script>
</head>

<body ng-controller="MainController" class="cdt">
	<portal>
		<!-- toaster -->
		<toasts notifications="notifications"></toasts>

		<!-- navigation menu -->
		<div ng-controller="navigationController"
			 ng-if="!isAChildOrAParent"
			 class="side-navbar"
             ng-include="'/diary/public/template/navigation/side-navbar.html'">
		</div>

		<!-- main templates -->
		<container template="main"></container>
	</portal>

	<!-- Invitation à essayer la nouvelle IHM React ; masquée par défaut, ui-switch.js décide de l'afficher
	     d'après la préférence `diaryUi`. Hors de <portal>, en position fixe. -->
	<div id="diary-ui-switch" class="diary-ui-switch" hidden>
		<div class="diary-ui-switch-text">
			<strong>{{#i18n}}diary.switch.invitation.title{{/i18n}}</strong>
			<span>{{#i18n}}diary.switch.invitation.body{{/i18n}}</span>
		</div>
		<div class="diary-ui-switch-actions">
			<button type="button" data-action="later">{{#i18n}}diary.switch.invitation.later{{/i18n}}</button>
			<button type="button" data-action="try" class="primary">{{#i18n}}diary.switch.invitation.try{{/i18n}}</button>
		</div>
	</div>

	<!-- Bascule permanente entre les deux interfaces, sans compteur : affichée tant que l'usager n'a fait
	     AUCUN choix dans les paramètres du compte (« Choix de la plateforme ») ; ui-switch.js la révèle. -->
	<div id="diary-ui-fab" class="diary-ui-fab" hidden>
		<div class="diary-ui-fab-menu" hidden>
			<button type="button" data-ui="react">{{#i18n}}diary.switch.fab.new{{/i18n}}</button>
			<button type="button" data-ui="angular" aria-current="true">{{#i18n}}diary.switch.fab.old{{/i18n}} ({{#i18n}}diary.switch.fab.current{{/i18n}})</button>
		</div>
		<button type="button" data-action="toggle" aria-haspopup="true">&#8644; {{#i18n}}diary.switch.fab.label{{/i18n}}</button>
	</div>
	<script type="text/javascript" src="/diary/public/ui-switch.js?v=@@VERSION"></script>
</body>

</html>
